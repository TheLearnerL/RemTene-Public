[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/remtene-adapters",
  "crates/remtene-application",
  "crates/remtene-asr-worker",
  "crates/remtene-contracts",
  "crates/remtene-domain",
  "crates/remtene-platform",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
futures = "0.3"
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
remtene-adapters = { path = "crates/remtene-adapters" }
remtene-application = { path = "crates/remtene-application" }
remtene-contracts = { path = "crates/remtene-contracts" }
remtene-domain = { path = "crates/remtene-domain" }
remtene-platform = { path = "crates/remtene-platform" }
getrandom = "0.4.3"
qwen-asr = "=0.9.0"
hound = "=3.5.1"
plist = "1.10.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rustix = { version = "1.0.7", features = ["fs"] }
sha2 = "0.10.8"
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-build = "2.6.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.19"
time = { version = "0.3.54", features = ["formatting", "local-offset"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
whisper-rs = { version = "=0.14.3", default-features = false, features = ["metal"] }
zeroize = "1.9.0"

[workspace.dependencies.block2]
version = "0.6.2"

[workspace.dependencies.core-foundation]
version = "0.10.1"

[workspace.dependencies.coreaudio-sys]
version = "0.2.17"

[workspace.dependencies.libc]
version = "0.2.183"

[workspace.dependencies.objc2]
version = "0.6.4"

[workspace.dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = [
  "std",
  "block2",
  "libc",
  "NSEvent",
  "NSWorkspace",
  "NSRunningApplication",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSSound",
]

[workspace.dependencies.objc2-av-foundation]
version = "0.3.2"
default-features = false
features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"]

[workspace.dependencies.objc2-foundation]
version = "0.3.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
