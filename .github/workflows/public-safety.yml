name: Public repository boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-boundary:
    name: Public allowlist and sensitive-data check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify public repository boundary
        shell: bash
        run: bash scripts/release/check-public-release.sh .

