[package]
name = "remtene-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remtene_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
remtene-adapters.workspace = true
remtene-application.workspace = true
remtene-contracts.workspace = true
remtene-domain.workspace = true
remtene-platform.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri-plugin-global-shortcut.workspace = true
time.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart.workspace = true
tauri-plugin-single-instance.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
plist.workspace = true
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[lints]
workspace = true
